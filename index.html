<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
  /********************
   * API
   ********************/
  const API_BASE_URL = "https://script.google.com/macros/s/AKfycbyy8GsTmHeYdgrmFi2wkN5pua7gilVpg-8v44jNucrHkN3XzW0jtcJWYD_JsZnbhiUWrQ/exec";

  /********************
   * 全局状态
   ********************/
  const state = {
    products: [],
    fonts: [],
    categories: [],
    settings: {},
    currentProduct: null,
    currentRotation: 0,
    currentFontSize: 28,
    drag: {
      active: false,
      offsetX: 0,
      offsetY: 0
    }
  };

  /********************
   * DOM
   ********************/
  const dom = {
    openProductBrowser: document.getElementById("openProductBrowser"),
    closeProductBrowser: document.getElementById("closeProductBrowser"),
    productBrowserModal: document.getElementById("productBrowserModal"),
    productGrid: document.getElementById("productGrid"),
    productSearchInput: document.getElementById("productSearchInput"),
    categoryFilter: document.getElementById("categoryFilter"),
    clearSearchBtn: document.getElementById("clearSearchBtn"),

    currentProductThumb: document.getElementById("currentProductThumb"),
    currentProductSku: document.getElementById("currentProductSku"),
    currentProductName: document.getElementById("currentProductName"),
    currentProductCategory: document.getElementById("currentProductCategory"),
    maxCharsDisplay: document.getElementById("maxCharsDisplay"),

    productBaseImage: document.getElementById("productBaseImage"),
    textLayer: document.getElementById("textLayer"),
    previewWrapper: document.getElementById("previewWrapper"),
    engravingInfoBox: document.getElementById("engravingInfoBox"),

    userText: document.getElementById("userText"),
    fontSelect: document.getElementById("fontSelect"),
    fontSizeRange: document.getElementById("fontSizeRange"),
    fontSizeInput: document.getElementById("fontSizeInput"),
    rotationRange: document.getElementById("rotationRange"),
    rotationInput: document.getElementById("rotationInput"),
    resetRotation: document.getElementById("resetRotation"),
    textColor: document.getElementById("textColor"),
    downloadBtn: document.getElementById("downloadBtn"),
    resetTextPositionBtn: document.getElementById("resetTextPositionBtn")
  };

  /********************
   * 工具函数
   ********************/
  function escapeHtml(str) {
    return String(str ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function isEnabled(value) {
    const v = String(value ?? "").trim().toLowerCase();
    return v === "" || v === "active" || v === "yes" || v === "true";
  }

  function getProductKey(product) {
    return product?.sku || product?.code || "";
  }

  function getProductName(product) {
    return product?.name_en || product?.name_cn || product?.name || "";
  }

  function getProductCategory(product) {
    return product?.category || product?.product_type || "";
  }

  function getProductMainImage(product) {
    return (
      product?.main_image ||
      product?.thumb_image ||
      product?.preview_image ||
      product?.image_a_url ||
      product?.image_b_url ||
      ""
    );
  }

  function getProductPreviewImage(product) {
    return (
      product?.preview_image ||
      product?.main_image ||
      product?.image_b_url ||
      product?.image_a_url ||
      ""
    );
  }

  function getFontName(font) {
    return font?.font_name || font?.name || "";
  }

  function getFontDisplayName(font) {
    return font?.display_name || font?.font_name || font?.name || "";
  }

  function getFontUrl(font) {
    return font?.font_url || font?.url || "";
  }

  /********************
   * 初始化
   ********************/
  async function initApp() {
    try {
      await loadAllData();
      renderCategoryFilter();
      await renderFontOptions();
      renderProductBrowser();
      bindEvents();

      if (state.products.length > 0) {
        selectProduct(getProductKey(state.products[0]));
      } else {
        updateEngravingInfoBox();
      }
    } catch (error) {
      console.error("Initialization failed:", error);
      alert("Initialization failed. Please check the Google Apps Script API URL and sheet data.");
    }
  }

  /********************
   * 数据加载
   ********************/
  async function loadAllData() {
    const url = API_BASE_URL + "?action=init";
    const res = await fetch(url);
    if (!res.ok) {
      throw new Error("API request failed");
    }

    const data = await res.json();

    state.products = (data.products || []).filter(p => isEnabled(p.status || p.active));
    state.fonts = (data.fonts || []).filter(f => isEnabled(f.status || f.active));
    state.categories = (data.categories || []).filter(c => isEnabled(c.status || c.active));
    state.settings = data.settings || {};

    console.log("products loaded:", state.products);
    console.log("fonts loaded:", state.fonts);
    console.log("categories loaded:", state.categories);
    console.log("settings loaded:", state.settings);
  }

  /********************
   * 渲染分类筛选
   ********************/
  function renderCategoryFilter() {
    dom.categoryFilter.innerHTML = "";

    const allOption = document.createElement("option");
    allOption.value = "";
    allOption.textContent = "All Categories";
    dom.categoryFilter.appendChild(allOption);

    state.categories
      .sort((a, b) => Number(a.sort || 999) - Number(b.sort || 999))
      .forEach(category => {
        const categoryName = category.category_name || category.name || category.category || "";
        if (!categoryName) return;

        const option = document.createElement("option");
        option.value = categoryName;
        option.textContent = categoryName;
        dom.categoryFilter.appendChild(option);
      });
  }

  /********************
   * 渲染字体
   ********************/
  async function renderFontOptions() {
    dom.fontSelect.innerHTML = "";

    const fonts = (state.fonts || [])
      .sort((a, b) => Number(a.sort || 999) - Number(b.sort || 999));

    if (!fonts.length) {
      console.error("No fonts found in state.fonts");
      return;
    }

    for (const font of fonts) {
      const fontName = getFontName(font);
      const displayName = getFontDisplayName(font);
      const fontUrl = getFontUrl(font);

      if (fontUrl && fontName) {
        injectFontFace(fontName, fontUrl);
      }

      if (!fontName) continue;

      const option = document.createElement("option");
      option.value = fontName;
      option.textContent = displayName || fontName;
      dom.fontSelect.appendChild(option);
    }

    if (fonts.length > 0) {
      const firstFont = getFontName(fonts[0]);
      if (firstFont) {
        dom.fontSelect.value = firstFont;
        updateFont(firstFont);
      }
    }

    updateEngravingInfoBox();
  }

  /********************
   * 动态注入字体
   ********************/
  function injectFontFace(fontName, fontUrl) {
    if (!fontName || !fontUrl) return;

    const styleId = `font-face-${fontName.replace(/[^a-zA-Z0-9_-]/g, "_")}`;
    if (document.getElementById(styleId)) return;

    const style = document.createElement("style");
    style.id = styleId;
    style.innerHTML = `
      @font-face {
        font-family: '${fontName}';
        src: url('${fontUrl}');
      }
    `;
    document.head.appendChild(style);
  }

  /********************
   * 渲染产品浏览器
   ********************/
  function renderProductBrowser() {
    const keyword = dom.productSearchInput.value.trim().toLowerCase();
    const category = dom.categoryFilter.value;

    const filtered = state.products
      .filter(product => {
        const sku = getProductKey(product).toLowerCase();
        const nameCn = String(product.name_cn || "").toLowerCase();
        const nameEn = String(product.name_en || product.name || "").toLowerCase();
        const productCategory = getProductCategory(product);
        const categoryMatch = !category || productCategory === category;
        const keywordMatch =
          !keyword ||
          sku.includes(keyword) ||
          nameCn.includes(keyword) ||
          nameEn.includes(keyword);

        return categoryMatch && keywordMatch;
      })
      .sort((a, b) => Number(a.sort || 999) - Number(b.sort || 999));

    if (!filtered.length) {
      dom.productGrid.innerHTML = '<div class="empty">No matching products found</div>';
      return;
    }

    dom.productGrid.innerHTML = filtered.map(product => {
      const sku = getProductKey(product);
      const name = getProductName(product);
      const categoryName = getProductCategory(product);
      const img = getProductMainImage(product);
      const isActive =
        state.currentProduct &&
        getProductKey(state.currentProduct) === sku;

      return `
        <div class="product-card ${isActive ? "active" : ""}" data-sku="${escapeHtml(sku)}">
          <img src="${escapeHtml(img)}" alt="${escapeHtml(sku)}" onerror="this.src='';this.alt='Image failed to load';" />
          <div class="sku">${escapeHtml(sku)}</div>
          <div class="name">${escapeHtml(name)}</div>
          <div class="category">${escapeHtml(categoryName)}</div>
        </div>
      `;
    }).join("");

    document.querySelectorAll(".product-card").forEach(card => {
      card.addEventListener("click", () => {
        const sku = card.dataset.sku;
        selectProduct(sku);
        closeProductBrowser();
      });
    });
  }

  /********************
   * 选择产品
   ********************/
  function selectProduct(productKey) {
    const product = state.products.find(p => getProductKey(p) === productKey);
    if (!product) return;

    state.currentProduct = product;

    updateCurrentProductInfo(product);
    loadProductPreview(product);
    applyProductDefaults(product);
    renderProductBrowser();
  }

  /********************
   * 更新左侧产品信息
   ********************/
  function updateCurrentProductInfo(product) {
    dom.currentProductThumb.src = getProductMainImage(product);
    dom.currentProductSku.textContent = getProductKey(product);
    dom.currentProductName.textContent = getProductName(product);
    dom.currentProductCategory.value = getProductCategory(product);
    dom.maxCharsDisplay.value = product.max_chars || "";

    updateEngravingInfoBox();
  }

  /********************
   * 加载预览图
   ********************/
  function loadProductPreview(product) {
    const imgSrc = getProductPreviewImage(product);
    dom.productBaseImage.src = imgSrc;

    dom.productBaseImage.onload = () => {
      updateEngravingInfoBox();
    };

    dom.productBaseImage.onerror = () => {
      console.error("Image failed to load:", imgSrc);
    };
  }

  /********************
   * 应用产品默认参数
   ********************/
  function applyProductDefaults(product) {
    const previewRect = dom.previewWrapper.getBoundingClientRect();

    const defaultX = Number(product.text_x || previewRect.width / 2);
    const defaultY = Number(product.text_y || previewRect.height / 2);
    const defaultFontSize = Number(product.default_font_size || state.settings.default_font_size || 28);
    const minFontSize = Number(product.min_font_size || 10);
    const maxFontSize = Number(product.max_font_size || 80);
    const defaultRotation = Number(product.default_rotation || 0);
    const defaultText = state.settings.default_text || "Your Text";

    state.currentFontSize = defaultFontSize;
    state.currentRotation = defaultRotation;

    dom.fontSizeRange.min = minFontSize;
    dom.fontSizeRange.max = maxFontSize;
    dom.fontSizeInput.min = minFontSize;
    dom.fontSizeInput.max = maxFontSize;

    dom.fontSizeRange.value = defaultFontSize;
    dom.fontSizeInput.value = defaultFontSize;

    dom.rotationRange.value = defaultRotation;
    dom.rotationInput.value = defaultRotation;

    if (!dom.userText.value.trim()) {
      dom.userText.value = defaultText;
    }

    updatePreviewText(dom.userText.value);
    updateFontSize(defaultFontSize);
    updateRotation(defaultRotation);

    dom.textLayer.style.left = defaultX + "px";
    dom.textLayer.style.top = defaultY + "px";
    dom.textLayer.dataset.baseX = defaultX;
    dom.textLayer.dataset.baseY = defaultY;

    const alignValue = String(product.text_align || "").toLowerCase();
    if (alignValue === "left") {
      dom.textLayer.style.textAlign = "left";
    } else if (alignValue === "right") {
      dom.textLayer.style.textAlign = "right";
    } else {
      dom.textLayer.style.textAlign = "center";
    }

    updateEngravingInfoBox();
  }

  /********************
   * 更新文字内容
   ********************/
  function updatePreviewText(text) {
    const maxChars = Number(state.currentProduct?.max_chars || 999);
    const finalText = (text || "").slice(0, maxChars);

    dom.userText.value = finalText;
    dom.textLayer.textContent = finalText || (state.settings.default_text || "Your Text");

    updateEngravingInfoBox();
  }

  /********************
   * 更新字体
   ********************/
  function updateFont(fontName) {
    dom.textLayer.style.fontFamily = `'${fontName}', Arial, sans-serif`;
    updateEngravingInfoBox();
  }

  /********************
   * 更新字号
   ********************/
  function updateFontSize(size) {
    const fontSize = Number(size || 28);
    state.currentFontSize = fontSize;
    dom.textLayer.style.fontSize = fontSize + "px";
    dom.fontSizeRange.value = fontSize;
    dom.fontSizeInput.value = fontSize;

    updateEngravingInfoBox();
  }

  /********************
   * 更新旋转
   ********************/
  function updateRotation(angle) {
    const value = Number(angle || 0);
    state.currentRotation = value;
    dom.rotationRange.value = value;
    dom.rotationInput.value = value;
    applyTextTransform();

    updateEngravingInfoBox();
  }

  function applyTextTransform() {
    dom.textLayer.style.transform = `translate(-50%, -50%) rotate(${state.currentRotation}deg)`;
  }

  /********************
   * 重置文字位置
   ********************/
  function resetTextPosition() {
    if (!state.currentProduct) return;

    const x = Number(state.currentProduct.text_x || dom.previewWrapper.clientWidth / 2);
    const y = Number(state.currentProduct.text_y || dom.previewWrapper.clientHeight / 2);

    dom.textLayer.style.left = x + "px";
    dom.textLayer.style.top = y + "px";

    updateEngravingInfoBox();
  }

  /********************
   * 打开/关闭产品浏览器
   ********************/
  function openProductBrowser() {
    dom.productBrowserModal.classList.add("show");
  }

  function closeProductBrowser() {
    dom.productBrowserModal.classList.remove("show");
  }

  /********************
   * 获取文字层坐标
   ********************/
  function getTextLayerPosition() {
    const wrapperRect = dom.previewWrapper.getBoundingClientRect();
    const textRect = dom.textLayer.getBoundingClientRect();

    const x = Math.round(textRect.left - wrapperRect.left);
    const y = Math.round(textRect.top - wrapperRect.top);
    const centerX = Math.round((textRect.left + textRect.width / 2) - wrapperRect.left);
    const centerY = Math.round((textRect.top + textRect.height / 2) - wrapperRect.top);

    return { x, y, centerX, centerY };
  }

  /********************
   * 信息框数据
   ********************/
  function getEngravingData() {
    const pos = getTextLayerPosition();

    return {
      productCode: getProductKey(state.currentProduct),
      productName: getProductName(state.currentProduct),
      category: getProductCategory(state.currentProduct),
      text: dom.userText?.value || dom.textLayer.textContent || "",
      fontName: dom.fontSelect?.value || "",
      fontSize: dom.fontSizeInput?.value || state.currentFontSize || "",
      rotation: state.currentRotation || 0,
      color: dom.textColor?.value || "#000000",
      x: pos.x,
      y: pos.y,
      centerX: pos.centerX,
      centerY: pos.centerY
    };
  }

  function buildEngravingInfoText() {
    const data = getEngravingData();

    return [
      `Product: ${data.productCode}`,
      `Name: ${data.productName}`,
      `Text: ${data.text.replace(/\n/g, " / ")}`,
      `Font: ${data.fontName}`,
      `Size: ${data.fontSize}`,
      `Rotation: ${data.rotation}°`,
      `X: ${data.x}`,
      `Y: ${data.y}`,
      `Center: (${data.centerX}, ${data.centerY})`,
      `Color: ${data.color}`
    ].join("\n");
  }

  function updateEngravingInfoBox() {
    if (!dom.engravingInfoBox) return;
    dom.engravingInfoBox.textContent = buildEngravingInfoText();
  }

  /********************
   * 导出预览图
   ********************/
  async function downloadPreview() {
    try {
      updateEngravingInfoBox();

      const canvas = await html2canvas(dom.previewWrapper, {
        backgroundColor: null,
        scale: Number(state.settings.export_scale || 2),
        useCORS: true
      });

      const link = document.createElement("a");
      const sku = getProductKey(state.currentProduct) || "preview";
      const now = new Date();
      const timeStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}_${String(now.getHours()).padStart(2, "0")}${String(now.getMinutes()).padStart(2, "0")}${String(now.getSeconds()).padStart(2, "0")}`;

      link.download = `${sku}_${timeStr}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    } catch (err) {
      console.error("Export failed:", err);
      alert("Export failed. Please check whether the image allows cross-origin access.");
    }
  }

  /********************
   * 拖拽文字
   ********************/
  function enableTextDragging() {
    const textLayer = dom.textLayer;
    const wrapper = dom.previewWrapper;

    textLayer.addEventListener("mousedown", (e) => {
      state.drag.active = true;

      const textRect = textLayer.getBoundingClientRect();
      state.drag.offsetX = e.clientX - textRect.left;
      state.drag.offsetY = e.clientY - textRect.top;

      document.body.style.userSelect = "none";
    });

    document.addEventListener("mousemove", (e) => {
      if (!state.drag.active) return;

      const wrapperRect = wrapper.getBoundingClientRect();
      const x = e.clientX - wrapperRect.left - state.drag.offsetX + textLayer.offsetWidth / 2;
      const y = e.clientY - wrapperRect.top - state.drag.offsetY + textLayer.offsetHeight / 2;

      dom.textLayer.style.left = x + "px";
      dom.textLayer.style.top = y + "px";

      updateEngravingInfoBox();
    });

    document.addEventListener("mouseup", () => {
      state.drag.active = false;
      document.body.style.userSelect = "";
      updateEngravingInfoBox();
    });
  }

  /********************
   * 绑定事件
   ********************/
  function bindEvents() {
    dom.openProductBrowser.addEventListener("click", openProductBrowser);
    dom.closeProductBrowser.addEventListener("click", closeProductBrowser);

    dom.productBrowserModal.addEventListener("click", (e) => {
      if (e.target === dom.productBrowserModal) {
        closeProductBrowser();
      }
    });

    dom.fontSelect.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        setTimeout(() => {
          updateFont(dom.fontSelect.value);
        }, 0);
      }
    });

    dom.fontSelect.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        updateFont(e.target.value);
      }
    });

    dom.productSearchInput.addEventListener("input", renderProductBrowser);
    dom.categoryFilter.addEventListener("change", renderProductBrowser);

    dom.clearSearchBtn.addEventListener("click", () => {
      dom.productSearchInput.value = "";
      dom.categoryFilter.value = "";
      renderProductBrowser();
    });

    dom.userText.addEventListener("input", (e) => {
      updatePreviewText(e.target.value);
    });

    dom.fontSelect.addEventListener("change", (e) => {
      updateFont(e.target.value);
    });

    dom.fontSizeRange.addEventListener("input", (e) => {
      updateFontSize(e.target.value);
    });

    dom.fontSizeInput.addEventListener("input", (e) => {
      updateFontSize(e.target.value);
    });

    dom.rotationRange.addEventListener("input", (e) => {
      updateRotation(e.target.value);
    });

    dom.rotationInput.addEventListener("input", (e) => {
      updateRotation(e.target.value);
    });

    dom.resetRotation.addEventListener("click", () => {
      updateRotation(0);
    });

    dom.textColor.addEventListener("input", (e) => {
      dom.textLayer.style.color = e.target.value;
      updateEngravingInfoBox();
    });

    dom.downloadBtn.addEventListener("click", downloadPreview);
    dom.resetTextPositionBtn.addEventListener("click", resetTextPosition);

    enableTextDragging();
  }

  /********************
   * 启动
   ********************/
  initApp();
</script>
